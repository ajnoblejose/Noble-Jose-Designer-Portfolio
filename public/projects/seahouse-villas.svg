<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient: Warm Sand #EEE5D8 -->
    <linearGradient id="sandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6EFE6"/>
      <stop offset="50%" stop-color="#EEE5D8"/>
      <stop offset="100%" stop-color="#E2D4C1"/>
    </linearGradient>

    <filter id="phoneShadow3" x="-20%" y="-15%" width="145%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#3D2E1C" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3D2E1C" flood-opacity="0.08"/>
    </filter>

    <filter id="cardShadow3" x="-15%" y="-15%" width="135%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4A3B2A" flood-opacity="0.10"/>
    </filter>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B63"/>
      <stop offset="100%" stop-color="#A67C46"/>
    </linearGradient>

    <linearGradient id="keyCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2823"/>
      <stop offset="100%" stop-color="#191614"/>
    </linearGradient>
  </defs>

  <!-- 4:3 Background Canvas -->
  <rect width="800" height="600" fill="url(#sandBg)"/>

  <!-- Subtle ambient decorative glow -->
  <circle cx="680" cy="140" r="200" fill="#E6D3BA" opacity="0.5" filter="blur(70px)"/>
  <circle cx="140" cy="460" r="180" fill="#DFCCA9" opacity="0.45" filter="blur(60px)"/>

  <!-- Left Accessory Card: VIP Concierge Service -->
  <g transform="translate(68, 140)" filter="url(#cardShadow3)">
    <rect width="216" height="154" rx="16" fill="#FFFFFF" stroke="#E6DAC8" stroke-width="1.5"/>
    <text x="18" y="28" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#9C7A4A" letter-spacing="0.06em">CURATED ITINERARY</text>
    <text x="18" y="48" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#2B231A">Sunset Catamaran</text>
    <text x="18" y="64" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#786B5D">Private Island Charter · 17:30</text>
    
    <line x1="18" y1="78" x2="198" y2="78" stroke="#F1E9DE" stroke-width="1"/>

    <g transform="translate(18, 90)">
      <circle cx="14" cy="14" r="14" fill="#F9F5EF"/>
      <text x="14" y="18" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">⛵</text>
      <text x="36" y="12" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#2B231A">Captain Marco</text>
      <text x="36" y="24" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#059669">Crew Ready at Pier 3</text>
    </g>

    <!-- Rating badge -->
    <rect x="18" y="124" width="76" height="18" rx="4" fill="#FEF3C7"/>
    <text x="24" y="136" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#92400E">★★★★★ 5.0 VIP</text>
  </g>

  <!-- Left Bottom Accessory: Private Butler Status -->
  <g transform="translate(68, 324)" filter="url(#cardShadow3)">
    <rect width="216" height="126" rx="16" fill="#FFFFFF" stroke="#E6DAC8" stroke-width="1.5"/>
    <text x="18" y="26" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#9C7A4A" letter-spacing="0.06em">DEDICATED BUTLER</text>
    <text x="18" y="46" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#2B231A">Elena Rostova</text>
    <text x="18" y="62" font-family="Inter, sans-serif" font-size="10" font-weight="400" fill="#786B5D">On Duty · Call at Extension 01</text>
    
    <rect x="18" y="78" width="180" height="32" rx="8" fill="#F8F3EC" stroke="#EDE2D3" stroke-width="1"/>
    <circle cx="32" cy="94" r="4" fill="#10B981"/>
    <text x="44" y="98" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#3D3226">Request Refreshment</text>
  </g>

  <!-- Center Main Feature: Luxury Mobile Concierge Device Mockup -->
  <g transform="translate(318, 54)" filter="url(#phoneShadow3)">
    <!-- Smartphone Bezel -->
    <rect width="258" height="494" rx="42" fill="#211C18" stroke="#3E342B" stroke-width="3"/>
    <!-- Screen Glass -->
    <rect x="7" y="7" width="244" height="480" rx="36" fill="#FAF7F2"/>

    <!-- Dynamic Island -->
    <rect x="86" y="16" width="86" height="20" rx="10" fill="#211C18"/>

    <!-- App Content Inside Screen -->
    <g transform="translate(22, 50)">
      <!-- Top Bar: Greeting & Ambient Temp -->
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#A67C46" letter-spacing="0.08em">VILLA AZURE · NOBLE</text>
      <text x="0" y="32" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#211C18">Welcome, Noble</text>
      <text x="144" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#5E5346">28°C ☀️</text>

      <!-- Digital Room Key Card -->
      <g transform="translate(0, 48)">
        <rect width="214" height="108" rx="16" fill="url(#keyCardGrad)"/>
        <!-- Golden accent accent lines -->
        <circle cx="180" cy="30" r="40" stroke="rgba(197, 155, 99, 0.2)" stroke-width="1" fill="none"/>
        <text x="16" y="24" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" fill="#C59B63" letter-spacing="0.06em">DIGITAL VILLA ACCESS</text>
        <text x="16" y="44" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Ocean Villa 08</text>
        <text x="16" y="60" font-family="Inter, sans-serif" font-size="9.5" font-weight="400" fill="#D6C6B2">NFC Encrypted Mobile Key</text>
        
        <rect x="16" y="74" width="112" height="22" rx="6" fill="#C59B63"/>
        <text x="72" y="88" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TAP TO UNLOCK</text>
      </g>

      <!-- Concierge Booking 1 -->
      <g transform="translate(0, 170)">
        <text x="0" y="14" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#8C7965" letter-spacing="0.05em">RESERVED SERVICES</text>
        
        <rect x="0" y="22" width="214" height="58" rx="12" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1"/>
        <circle cx="20" cy="51" r="12" fill="#F7EFE4"/>
        <text x="20" y="55" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">🍽️</text>
        <text x="40" y="45" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#211C18">Private Chef Tasting</text>
        <text x="40" y="59" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#8A7B6B">Tonight · 20:00 · In-Villa</text>
        <rect x="156" y="41" width="46" height="18" rx="4" fill="#ECFDF5"/>
        <text x="162" y="53" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#047857">Confirmed</text>
      </g>

      <!-- Concierge Booking 2 -->
      <g transform="translate(0, 260)">
        <rect x="0" y="0" width="214" height="58" rx="12" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1"/>
        <circle cx="20" cy="29" r="12" fill="#F7EFE4"/>
        <text x="20" y="33" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">🧖‍♀️</text>
        <text x="40" y="23" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#211C18">Lagoon Spa Ritual</text>
        <text x="40" y="37" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#8A7B6B">Tomorrow · 10:30 AM</text>
        <rect x="156" y="19" width="46" height="18" rx="4" fill="#FEF3C7"/>
        <text x="162" y="31" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#B45309">Reserved</text>
      </g>

      <!-- Quick Action Bar -->
      <g transform="translate(0, 330)">
        <rect x="0" y="0" width="102" height="48" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1"/>
        <text x="12" y="20" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#8C7965">BUGGY PICKUP</text>
        <text x="12" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#211C18">3 mins</text>

        <rect x="112" y="0" width="102" height="48" rx="10" fill="#FFFFFF" stroke="#EAE0D2" stroke-width="1"/>
        <text x="124" y="20" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#8C7965">POOL CLIMATE</text>
        <text x="124" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#C59B63">28.5°C</text>
      </g>
    </g>
  </g>

  <!-- Right Accessory Card: Smart Environment Hub -->
  <g transform="translate(600, 240)" filter="url(#cardShadow3)">
    <rect width="148" height="168" rx="16" fill="#FFFFFF" stroke="#E6DAC8" stroke-width="1.5"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" fill="#9C7A4A" letter-spacing="0.05em">ROOM AMBIENCE</text>
    <text x="16" y="44" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#2B231A">Sunset Mode</text>
    
    <g transform="translate(16, 56)">
      <text x="0" y="12" font-family="Inter, sans-serif" font-size="9" fill="#786B5D">Lights Warm 40%</text>
      <rect x="0" y="18" width="116" height="6" rx="3" fill="#EFE8DD"/>
      <rect x="0" y="18" width="54" height="6" rx="3" fill="#C59B63"/>

      <text x="0" y="42" font-family="Inter, sans-serif" font-size="9" fill="#786B5D">Bose Acoustics</text>
      <text x="0" y="56" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#2B231A">Chill Coastal Jazz</text>
    </g>

    <rect x="16" y="124" width="116" height="26" rx="6" fill="#C59B63"/>
    <text x="74" y="141" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Adjust Controls</text>
  </g>
</svg>

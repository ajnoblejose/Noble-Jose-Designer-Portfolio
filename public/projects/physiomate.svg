<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient: Soft Blue #E0ECF7 -->
    <linearGradient id="softBlueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FA"/>
      <stop offset="50%" stop-color="#E0ECF7"/>
      <stop offset="100%" stop-color="#CFE2F4"/>
    </linearGradient>

    <filter id="clinicShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1B3854" flood-opacity="0.09"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B3854" flood-opacity="0.04"/>
    </filter>

    <filter id="floatShadow4" x="-15%" y="-15%" width="135%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F2840" flood-opacity="0.10"/>
    </filter>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- 4:3 Background Canvas -->
  <rect width="800" height="600" fill="url(#softBlueBg)"/>

  <!-- Subtle ambient decorative glow -->
  <circle cx="680" cy="120" r="190" fill="#B9D9F3" opacity="0.5" filter="blur(65px)"/>
  <circle cx="120" cy="480" r="170" fill="#B3D3EE" opacity="0.55" filter="blur(55px)"/>

  <!-- Main Clinical Dashboard Window -->
  <g transform="translate(64, 60)" filter="url(#clinicShadow)">
    <rect width="672" height="480" rx="16" fill="#FFFFFF" stroke="#D3E4F3" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="672" height="46" rx="16" fill="#F8FAFC"/>
    <line x1="0" y1="46" x2="672" y2="46" stroke="#E2EDF7" stroke-width="1"/>

    <!-- Controls -->
    <circle cx="28" cy="23" r="5" fill="#FF5F56"/>
    <circle cx="44" cy="23" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="23" r="5" fill="#27C93F"/>

    <text x="336" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#334E68" text-anchor="middle">
      PhysioMate · Clinical Rehabilitation Platform
    </text>

    <!-- Patient Banner Row -->
    <g transform="translate(24, 62)">
      <rect x="0" y="0" width="624" height="60" rx="10" fill="#F3F8FC" stroke="#E0EDF8" stroke-width="1"/>
      
      <!-- Patient Avatar -->
      <circle cx="34" cy="30" r="18" fill="#DBEAFE"/>
      <text x="34" y="35" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">SJ</text>

      <text x="64" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Sarah Jenkins</text>
      <text x="64" y="42" font-family="Inter, sans-serif" font-size="10.5" font-weight="500" fill="#627D98">Lumbar Spine Protocol · Week 6 of 12 · Therapist: Noble Jose</text>

      <!-- Adherence pill -->
      <rect x="496" y="18" width="114" height="24" rx="6" fill="#ECFDF5"/>
      <circle cx="508" cy="30" r="3.5" fill="#10B981"/>
      <text x="516" y="34" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#047857">94% Adherence</text>
    </g>

    <!-- Main Workspace: Chart on Left, Protocol on Right -->
    <g transform="translate(24, 138)">
      
      <!-- Recovery Curve Analytics Card (Left) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="374" height="302" rx="12" fill="#FFFFFF" stroke="#E2EDF7" stroke-width="1"/>
        
        <text x="18" y="26" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#102A43">Range of Motion (ROM) Velocity</text>
        <text x="18" y="42" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#627D98">Active extension angle progression vs cohort baseline</text>

        <!-- Current Status Metric -->
        <g transform="translate(268, 12)">
          <text x="0" y="16" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#2563EB">88°</text>
          <text x="40" y="16" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#047857">+16°</text>
          <text x="0" y="28" font-family="Inter, sans-serif" font-size="8.5" font-weight="500" fill="#627D98">Target: 90°</text>
        </g>

        <!-- Chart Grid Lines -->
        <g transform="translate(18, 64)">
          <line x1="30" y1="20" x2="340" y2="20" stroke="#F0F4F8" stroke-dasharray="3 3"/>
          <line x1="30" y1="60" x2="340" y2="60" stroke="#F0F4F8" stroke-dasharray="3 3"/>
          <line x1="30" y1="100" x2="340" y2="100" stroke="#F0F4F8" stroke-dasharray="3 3"/>
          <line x1="30" y1="140" x2="340" y2="140" stroke="#E2EDF7"/>

          <!-- Target Line -->
          <line x1="30" y1="40" x2="340" y2="40" stroke="#93C5FD" stroke-dasharray="4 4" stroke-width="1.2"/>
          <text x="306" y="36" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#2563EB">TARGET 90°</text>

          <!-- Area fill -->
          <path d="M 40 135 Q 90 120, 150 90 T 260 52 T 330 42 L 330 140 L 40 140 Z" fill="url(#curveGradient)"/>
          
          <!-- Line Curve -->
          <path d="M 40 135 Q 90 120, 150 90 T 260 52 T 330 42" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round"/>

          <!-- Milestone Dots -->
          <circle cx="40" cy="135" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
          <circle cx="150" cy="90" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
          <circle cx="260" cy="52" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
          <circle cx="330" cy="42" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>

          <!-- Milestone Tooltip Tag -->
          <rect x="270" y="8" width="68" height="20" rx="4" fill="#1E293B"/>
          <text x="304" y="21" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Today: 88° ✓</text>

          <!-- X Labels -->
          <text x="40" y="156" font-family="Inter, sans-serif" font-size="8.5" fill="#829AB1" text-anchor="middle">W1</text>
          <text x="110" y="156" font-family="Inter, sans-serif" font-size="8.5" fill="#829AB1" text-anchor="middle">W2</text>
          <text x="180" y="156" font-family="Inter, sans-serif" font-size="8.5" fill="#829AB1" text-anchor="middle">W3</text>
          <text x="260" y="156" font-family="Inter, sans-serif" font-size="8.5" fill="#829AB1" text-anchor="middle">W4</text>
          <text x="330" y="156" font-family="Inter, sans-serif" font-size="8.5" fill="#2563EB" font-weight="700" text-anchor="middle">W6 (Now)</text>
        </g>

        <!-- Pain Reduction Indicator -->
        <g transform="translate(18, 240)">
          <rect x="0" y="0" width="338" height="44" rx="8" fill="#F8FAFC" stroke="#E2EDF7" stroke-width="1"/>
          <text x="14" y="18" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#486581">PAIN REPORT INDEX (VAS)</text>
          <text x="14" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#047857">Decreased from 7.5 to 1.8 / 10</text>
          <rect x="250" y="12" width="76" height="20" rx="4" fill="#ECFDF5"/>
          <text x="256" y="25" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#059669">-76% Pain Level</text>
        </g>
      </g>

      <!-- Rehabilitation Protocol Checklist Card (Right) -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="234" height="302" rx="12" fill="#FFFFFF" stroke="#E2EDF7" stroke-width="1"/>
        
        <text x="16" y="24" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#102A43">Prescribed Protocol</text>
        <text x="16" y="38" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#627D98">Daily Clinical Home Routine</text>

        <!-- Exercise 1 -->
        <g transform="translate(14, 52)">
          <rect x="0" y="0" width="206" height="62" rx="8" fill="#F4F9FD" stroke="#D3E4F3" stroke-width="1"/>
          <circle cx="16" cy="22" r="7" fill="#DBEAFE"/>
          <path d="M 13 22 L 15 24 L 19 19" stroke="#1D4ED8" stroke-width="1.6" fill="none"/>
          <text x="30" y="20" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">Prone Lumbar Extension</text>
          <text x="30" y="34" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#627D98">3 sets × 10 reps · Hold 5s</text>
          <rect x="30" y="40" width="60" height="14" rx="3" fill="#ECFDF5"/>
          <text x="35" y="50" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#047857">Completed ✓</text>
        </g>

        <!-- Exercise 2 -->
        <g transform="translate(14, 122)">
          <rect x="0" y="0" width="206" height="62" rx="8" fill="#F4F9FD" stroke="#D3E4F3" stroke-width="1"/>
          <circle cx="16" cy="22" r="7" fill="#DBEAFE"/>
          <path d="M 13 22 L 15 24 L 19 19" stroke="#1D4ED8" stroke-width="1.6" fill="none"/>
          <text x="30" y="20" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">Pelvic Tilts on Roller</text>
          <text x="30" y="34" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#627D98">2 sets × 15 reps · Moderate</text>
          <rect x="30" y="40" width="60" height="14" rx="3" fill="#ECFDF5"/>
          <text x="35" y="50" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#047857">Completed ✓</text>
        </g>

        <!-- Exercise 3 -->
        <g transform="translate(14, 192)">
          <rect x="0" y="0" width="206" height="62" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
          <circle cx="16" cy="22" r="7" fill="#EFF6FF"/>
          <text x="30" y="20" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">Dynamic Hip Bridges</text>
          <text x="30" y="34" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#627D98">3 sets × 12 reps · Glute bias</text>
          <rect x="30" y="40" width="60" height="14" rx="3" fill="#FEF3C7"/>
          <text x="36" y="50" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#B45309">Scheduled</text>
        </g>

        <!-- Clinician Sign-off -->
        <g transform="translate(14, 262)">
          <rect x="0" y="0" width="206" height="28" rx="6" fill="#F8FAFC"/>
          <text x="8" y="18" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#486581">Next Checkup: Today 15:30</text>
        </g>
      </g>
    </g>
  </g>
</svg>
